<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面未找到 — PawUI</title>
<style>
  :root { --bg:#08080b; --text:#f5f5f7; --text2:rgba(245,245,247,.62); --accent:#5b8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(700px 400px at 50% -10%, rgba(91,140,255,.22), transparent 70%), var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
    text-align:center; padding:32px;
  }
  .code { font-size:clamp(64px,16vw,120px); font-weight:700; letter-spacing:-.04em;
    background:linear-gradient(100deg,#c7dbff,#5b8cff 50%,#34d3ee);
    -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1; }
  h1 { font-size:clamp(20px,3.5vw,28px); font-weight:650; margin:18px 0 10px; letter-spacing:-.02em; }
  p { color:var(--text2); font-size:15px; line-height:1.7; max-width:420px; margin:0 auto 28px; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a.btn { display:inline-flex; align-items:center; height:42px; padding:0 20px; border-radius:100px;
    font-size:14px; font-weight:600; text-decoration:none; transition:transform .3s cubic-bezier(.16,1,.3,1); }
  a.btn:hover { transform:translateY(-2px); }
  a.primary { background:#f5f5f7; color:#08080b; }
  a.secondary { background:rgba(255,255,255,.06); color:#f5f5f7; border:1px solid rgba(255,255,255,.12); }
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>页面走丢了</h1>
    <p>你访问的页面不存在或已被移动。回到首页，或前往文档继续。</p>
    <div class="row">
      <a class="btn primary" href="index.html" data-go="home">返回首页</a>
      <a class="btn secondary" href="docs/index.html" data-go="docs">浏览文档</a>
    </div>
  </div>
<script>
  // Relative paths work for local preview; on the web (arbitrary 404 path),
  // rewrite to root-absolute URLs so they resolve correctly.
  if (location.protocol !== 'file:') {
    var h = document.querySelector('[data-go="home"]');
    var d = document.querySelector('[data-go="docs"]');
    if (h) h.setAttribute('href', '/');
    if (d) d.setAttribute('href', '/docs/');
  }
</script>
</body>
</html>
